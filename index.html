<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosquito Hunter</title>
    <link rel="stylesheet" href="style.css">

    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Title Screen -->
    <div id="title-screen">
        <img id="title-image" src="assets/Mosquito title 2.png" alt="Mosquito Hunter">
    </div>

    <!-- Eye Tracking Progress Bar -->
    <div id="eye-tracking-progress" style="display: none;">
        <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-text">Calibrating Eye Tracking...</div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" style="display: none;">
        <img id="win-screen-image" src="assets/Win Screen.png" alt="Victory">
        <img id="play-again-button" src="assets/play again.png" alt="Play Again">
    </div>

    <div id="game-container">
        <div id="canvas-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="game-canvas"></canvas>
            <canvas id="hand-canvas"></canvas>
        </div>

        <!-- Volume Bar -->
        <div id="volume-bar-container">
            <div id="volume-bar-bg">
                <div id="volume-bar-fill"></div>
            </div>
            <div id="volume-label">Sound: 0 Hz</div>
        </div>

        <!-- Hidden elements for game functionality -->
        <button id="start-scan-btn" style="display:none;">Start</button>
        <button id="restart-btn" style="display:none;">Restart</button>
        <div id="mode-text" style="display:none;"></div>
        <div id="kills" style="display:none;">0</div>
        <div id="souls" style="display:none;">0</div>
        <div id="audio-status" style="display:none;">OFF</div>
        <div id="frequency-display" style="display:none;">0</div>
        <div id="game-state" style="display:none;">WAITING</div>
        <div id="hands-count" style="display:none;">0</div>
        <div id="hand-distance" style="display:none;">-</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
